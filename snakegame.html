<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
body{
margin:0;
background:#111;
color:#fff;
font-family:sans-serif;
display:flex;
flex-direction:column;
align-items:center;
touch-action:none;
user-select:none;
-webkit-user-select:none;
}

h1{
margin:15px 0 5px;
}

#score{
font-size:22px;
margin-bottom:10px;
}

canvas{
background:#000;
border:3px solid #444;
max-width:95vw;
max-height:95vw;
}

#controls{
margin-top:15px;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.row{
display:flex;
gap:8px;
}

button{
width:70px;
height:70px;
font-size:28px;
border:none;
border-radius:12px;
background:#2d2d2d;
color:white;
}

button:active{
transform:scale(0.95);
}

#gameOver{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
gap:15px;
font-size:28px;
}

#restart{
width:180px;
height:60px;
font-size:22px;
}
</style>
</head>
<body>

<h1>🐍 SNAKE</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="400" height="400"></canvas>

<div id="controls">
<button id="up">↑</button>

<div class="row">
<button id="left">←</button>
<button id="down">↓</button>
<button id="right">→</button>
</div>
</div>

<div id="gameOver">
<div>GAME OVER</div>
<div id="finalScore"></div>
<button id="restart">リスタート</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const size=20;
const tiles=20;

let snake;
let food;
let dx;
let dy;
let score;
let gameLoop;

function startGame(){

snake=[
{x:10,y:10}
];

food=randomFood();

dx=1;
dy=0;

score=0;

document.getElementById("score").textContent=
"Score: 0";

document.getElementById("gameOver").style.display=
"none";

clearInterval(gameLoop);
gameLoop=setInterval(update,120);
}

function randomFood(){

let pos;

do{

pos={
x:Math.floor(Math.random()*tiles),
y:Math.floor(Math.random()*tiles)
};

}while(
snake.some(
s=>s.x===pos.x&&s.y===pos.y
)
);

return pos;
}

function update(){

const head={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(
head.x<0||
head.y<0||
head.x>=tiles||
head.y>=tiles
){
return endGame();
}

for(let part of snake){

if(
head.x===part.x&&
head.y===part.y
){
return endGame();
}
}

snake.unshift(head);

if(
head.x===food.x&&
head.y===food.y
){

score++;

document.getElementById("score").textContent=
"Score: "+score;

food=randomFood();

}else{

snake.pop();
}

draw();
}

function draw(){

ctx.fillStyle="#000";
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="red";

ctx.fillRect(
food.x*size,
food.y*size,
size,
size
);

snake.forEach((part,index)=>{

ctx.fillStyle=
index===0
?"#66ff66"
:"#22aa22";

ctx.fillRect(
part.x*size,
part.y*size,
size,
size
);

ctx.strokeStyle="#111";
ctx.strokeRect(
part.x*size,
part.y*size,
size,
size
);

});
}

function endGame(){

clearInterval(gameLoop);

document.getElementById("finalScore").textContent=
"Score: "+score;

document.getElementById("gameOver").style.display=
"flex";
}

function changeDirection(newDx,newDy){

if(
snake.length>1 &&
newDx===-dx &&
newDy===-dy
){
return;
}

dx=newDx;
dy=newDy;
}

document.getElementById("up").onclick=
()=>changeDirection(0,-1);

document.getElementById("down").onclick=
()=>changeDirection(0,1);

document.getElementById("left").onclick=
()=>changeDirection(-1,0);

document.getElementById("right").onclick=
()=>changeDirection(1,0);

document.getElementById("restart").onclick=
startGame;

draw();
startGame();
</script>

</body>
</html>
