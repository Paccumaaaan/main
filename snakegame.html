<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GUMMY SNAKE</title>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:sans-serif;
background:linear-gradient(180deg,#7ed957,#59b93d);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
overflow:hidden;
user-select:none;
}

.screen{
width:100%;
max-width:520px;
padding:20px;
text-align:center;
}

h1{
margin:10px 0;
font-size:42px;
}

.panel{
background:rgba(0,0,0,.25);
border-radius:20px;
padding:15px;
margin:15px 0;
backdrop-filter:blur(4px);
}

.scoreLine{
font-size:24px;
margin:8px 0;
}

.big{
font-size:32px;
font-weight:bold;
}

button{
border:none;
border-radius:18px;
background:#ff5cb8;
color:white;
font-size:22px;
font-weight:bold;
padding:14px 26px;
cursor:pointer;
}

button:active{
transform:scale(.95);
}

#gameScreen{
display:none;
}

#hud{
display:flex;
justify-content:space-between;
font-size:22px;
margin-bottom:10px;
}

canvas{
border:4px solid rgba(255,255,255,.4);
border-radius:12px;
background:#7ac84a;
width:100%;
max-width:500px;
aspect-ratio:1/1;
}

#controls{
margin-top:15px;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.row{
display:flex;
gap:8px;
}

.ctrl{
width:80px;
height:80px;
padding:0;
font-size:32px;
}

#gameOver{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

#gameOverBox{
background:#2d2d2d;
padding:25px;
border-radius:20px;
width:100%;
max-width:400px;
text-align:center;
}

#newRecord{
color:#ffd700;
font-size:28px;
margin:12px 0;
display:none;
}
</style>
</head>
<body>

<div id="titleScreen" class="screen">

<h1>🐍<br>GUMMY SNAKE</h1>

<div class="panel">
<div class="big">HIGH SCORES</div>

<div class="scoreLine">🥇 <span id="hs1">0</span></div>
<div class="scoreLine">🥈 <span id="hs2">0</span></div>
<div class="scoreLine">🥉 <span id="hs3">0</span></div>
</div>

<div class="panel">
<div class="big">GAME COINS</div>
<div id="coinDisplay" class="big">0</div>
</div>

<button id="startBtn">START</button>

</div>

<div id="gameScreen" class="screen">

<div id="hud">
<div>Score: <span id="score">0</span></div>
<div>Coins: <span id="coins">0</span></div>
</div>

<canvas id="game" width="500" height="500"></canvas>

<div id="controls">
<button class="ctrl" id="up">↑</button>

<div class="row">
<button class="ctrl" id="left">←</button>
<button class="ctrl" id="down">↓</button>
<button class="ctrl" id="right">→</button>
</div>
</div>

</div>

<div id="gameOver">

<div id="gameOverBox">

<h2>GAME OVER</h2>

<div class="big">
Score:
<span id="finalScore">0</span>
</div>

<div id="newRecord">
🏆 NEW RECORD!
</div>

<div class="panel">
<div class="big">
GAME COINS
</div>
<div id="finalCoins" class="big">
0
</div>
</div>

<button id="playAgain">
PLAY AGAIN
</button>

<br><br>

<button id="backTitle">
TITLE
</button>

</div>

</div>

<script>
const STORAGE_KEY="gummySnakeHighScores";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const tileSize=25;
const tiles=20;

let snake=[];
let food={x:0,y:0};

let dx=1;
let dy=0;

let score=0;
let loop=null;

function getScores(){
return JSON.parse(
localStorage.getItem(STORAGE_KEY)||"[0,0,0]"
);
}

function saveScores(scores){
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(scores)
);
}

function getCoins(){
const s=getScores();
return Math.floor(
(s[0]+s[1]+s[2])/5
);
}

function updateTitle(){
const s=getScores();

document.getElementById("hs1").textContent=s[0];
document.getElementById("hs2").textContent=s[1];
document.getElementById("hs3").textContent=s[2];

document.getElementById("coinDisplay").textContent=
getCoins();
}

function randomFood(){

let pos;

do{

pos={
x:Math.floor(Math.random()*tiles),
y:Math.floor(Math.random()*tiles)
};

}while(
snake.some(
p=>p.x===pos.x&&p.y===pos.y
)
);

return pos;
}

function startGame(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

food=randomFood();

dx=1;
dy=0;
score=0;

document.getElementById("score").textContent=0;
document.getElementById("coins").textContent=getCoins();

document.getElementById("gameOver").style.display="none";

clearInterval(loop);
loop=setInterval(update,120);

draw();
}

function drawGrass(){

for(let y=0;y<tiles;y++){

for(let x=0;x<tiles;x++){

ctx.fillStyle=
(x+y)%2===0
?"#8dde63"
:"#78cc51";

ctx.fillRect(
x*tileSize,
y*tileSize,
tileSize,
tileSize
);

}

}

}

function draw(){

drawGrass();

ctx.fillStyle="#ff4fa3";

ctx.beginPath();

ctx.arc(
food.x*tileSize+tileSize/2,
food.y*tileSize+tileSize/2,
tileSize/3,
0,
Math.PI*2
);

ctx.fill();

snake.forEach((part,index)=>{

ctx.fillStyle=
index===0
?"#b4ff8a"
:"#2ecc71";

ctx.fillRect(
part.x*tileSize,
part.y*tileSize,
tileSize,
tileSize
);

ctx.strokeStyle=
"rgba(0,0,0,.2)";

ctx.strokeRect(
part.x*tileSize,
part.y*tileSize,
tileSize,
tileSize
)
