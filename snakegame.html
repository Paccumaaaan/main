<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GUMMY SNAKE DX</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:sans-serif;
background:linear-gradient(180deg,#7fd957,#5cb63f);
overflow:hidden;
color:white;
user-select:none;
touch-action:none;
}

.screen{
width:100vw;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

h1{
margin:0;
font-size:42px;
text-align:center;
}

.panel{
background:rgba(0,0,0,.25);
padding:15px;
border-radius:18px;
margin-top:15px;
width:min(420px,95vw);
backdrop-filter:blur(4px);
}

.big{
font-size:28px;
font-weight:bold;
}

.scoreLine{
font-size:22px;
margin:8px 0;
}

button{
border:none;
background:#ff59b3;
color:white;
font-size:22px;
font-weight:bold;
padding:14px 26px;
border-radius:18px;
}

button:active{
transform:scale(.95);
}

#gameScreen{
display:none;
}

#hud{
display:flex;
justify-content:space-between;
align-items:center;
width:min(500px,95vw);
margin-bottom:10px;
font-size:20px;
font-weight:bold;
}

#game{
border:4px solid rgba(255,255,255,.4);
border-radius:12px;
width:min(500px,95vw);
height:min(500px,95vw);
display:block;
}

#controls{
margin-top:15px;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.row{
display:flex;
gap:8px;
}

.ctrl{
width:80px;
height:80px;
padding:0;
font-size:32px;
}

#pauseBtn{
padding:10px 18px;
font-size:18px;
}

#floatingText{
position:fixed;
left:0;
top:0;
pointer-events:none;
font-size:28px;
font-weight:bold;
display:none;
text-shadow:0 0 10px rgba(0,0,0,.5);
}

#gameOver{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

#gameOverBox{
background:#2c2c2c;
width:min(420px,95vw);
padding:25px;
border-radius:20px;
text-align:center;
}

#newRecord{
display:none;
font-size:28px;
color:gold;
margin:12px 0;
}

#pauseOverlay{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
font-size:48px;
font-weight:bold;
background:rgba(0,0,0,.5);
}

</style>
</head>

<body>

<div id="titleScreen" class="screen">

<h1>
🐍<br>
GUMMY SNAKE DX
</h1>

<div class="panel">

<div class="big">
HIGH SCORES
</div>

<div class="scoreLine">
🥇 <span id="hs1">0</span>
</div>

<div class="scoreLine">
🥈 <span id="hs2">0</span>
</div>

<div class="scoreLine">
🥉 <span id="hs3">0</span>
</div>

</div>

<div class="panel">

<div class="big">
GAME COINS
</div>

<div class="big" id="coinCount">
0
</div>

</div>

<div class="panel">

<div class="big">
PLAYS
</div>

<div class="big" id="playCount">
0
</div>

</div>

<br>

<button id="startBtn">
START
</button>

</div>

<div id="gameScreen" class="screen">

<div id="hud">

<div>
Score:
<span id="score">
0
</span>
</div>

<div>
Coins:
<span id="coins">
0
</span>
</div>

<button id="pauseBtn">
⏸
</button>

</div>

<canvas
id="game"
width="500"
height="500">
</canvas>

<div id="controls">

<button
class="ctrl"
id="up">
↑
</button>

<div class="row">

<button
class="ctrl"
id="left">
←
</button>

<button
class="ctrl"
id="down">
↓
</button>

<button
class="ctrl"
id="right">
→
</button>

</div>

</div>

</div>

<div id="floatingText">
+1
</div>

<div id="pauseOverlay">
PAUSED
</div>

<div id="gameOver">

<div id="gameOverBox">

<h2>
GAME OVER
</h2>

<div class="big">

Score:
<span id="finalScore">
0
</span>

</div>

<div id="newRecord">
🏆 NEW RECORD
</div>

<div class="panel">

<div class="big">
GAME COINS
</div>

<div class="big" id="finalCoins">
0
</div>

</div>

  <button id="playAgain">
PLAY AGAIN
</button>

<br><br>

<button id="backTitle">
TITLE
</button>

</div>

</div>

<script>

const SCORE_KEY =
"paccumaaan_snake_scores";

const PLAY_KEY =
"paccumaaan_snake_plays";

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const tileSize = 25;
const tiles = 20;

let snake = [];
let food = null;

let dx = 1;
let dy = 0;

let score = 0;

let loop = null;

let speed = 120;

let paused = false;

let touchStartX = 0;
let touchStartY = 0;

function getScores(){

return JSON.parse(
localStorage.getItem(
SCORE_KEY
) || "[0,0,0]"
);

}

function saveScores(scores){

localStorage.setItem(
SCORE_KEY,
JSON.stringify(scores)
);

}

function getPlayCount(){

return Number(
localStorage.getItem(
PLAY_KEY
) || 0
);

}

function addPlay(){

localStorage.setItem(
PLAY_KEY,
getPlayCount()+1
);

}

function getCoins(){

const s =
getScores();

return Math.floor(
(
s[0]+
s[1]+
s[2]
)/5
);

}

function updateTitle(){

const s =
getScores();

document.getElementById(
"hs1"
).textContent = s[0];

document.getElementById(
"hs2"
).textContent = s[1];

document.getElementById(
"hs3"
).textContent = s[2];

document.getElementById(
"coinCount"
).textContent =
getCoins();

document.getElementById(
"playCount"
).textContent =
getPlayCount();

}

function randomFood(){

let pos;

do{

const roll =
Math.random();

let value = 1;
let color = "#ff4fa3";

if(
roll < 0.03
){

value = 10;
color = "#67d8ff";

}else if(
roll < 0.15
){

value = 5;
color = "#ffd93d";

}

pos = {

x:
Math.floor(
Math.random()*tiles
),

y:
Math.floor(
Math.random()*tiles
),

value,
color

};

}while(

snake.some(

p=>

p.x===pos.x &&
p.y===pos.y

)

);

return pos;

}

function startGame(){

addPlay();

snake = [

{x:10,y:10},
{x:9,y:10},
{x:8,y:10}

];

food =
randomFood();

dx = 1;
dy = 0;

score = 0;

speed = 120;

paused = false;

document.getElementById(
"pauseOverlay"
).style.display =
"none";

document.getElementById(
"score"
).textContent =
score;

document.getElementById(
"coins"
).textContent =
getCoins();

clearInterval(loop);

loop =
setInterval(
update,
speed
);

draw();

}

function restartLoop(){

clearInterval(loop);

loop =
setInterval(
update,
speed
);

}

function drawGrass(){

for(
let y=0;
y<tiles;
y++
){

for(
let x=0;
x<tiles;
x++
){

ctx.fillStyle =

(x+y)%2===0

?

"#8dde63"

:

"#78cc51";

ctx.fillRect(

x*tileSize,
y*tileSize,
tileSize,
tileSize

);

}

}

}

function drawFood(){

ctx.fillStyle =
food.color;

ctx.beginPath();

ctx.arc(

food.x*tileSize+
tileSize/2,

food.y*tileSize+
tileSize/2,

tileSize/3,

0,
Math.PI*2

);

ctx.fill();

}

function drawSnake(){

snake.forEach(

(part,index)=>{

let color;

if(index===0){

color =
"#c7ff9d";

}else{

if(
snake.length >= 50
){

color =
"hsl("+
(
index*8
)%360+
",80%,55%)";

}else{

color =
"#2ecc71";

}

}

ctx.fillStyle =
color;

ctx.fillRect(

part.x*tileSize,
part.y*tileSize,
tileSize,
tileSize

);

ctx.strokeStyle =
"rgba(0,0,0,.2)";

ctx.strokeRect(

part.x*tileSize,
part.y*tileSize,
tileSize,
tileSize

);

}

);

}

function draw(){

drawGrass();

drawFood();

drawSnake();

}

  function showFloatingText(text){

const el =
document.getElementById(
"floatingText"
);

el.textContent =
text;

el.style.display =
"block";

el.style.left =
(window.innerWidth/2-20)
+"px";

el.style.top =
"120px";

let y = 120;
let opacity = 1;

const anim =
setInterval(()=>{

y -= 2;

opacity -= 0.03;

el.style.top =
y+"px";

el.style.opacity =
opacity;

if(opacity<=0){

clearInterval(
anim
);

el.style.display =
"none";

}

},16);

}

function gameOver(){

clearInterval(loop);

let scores =
getScores();

const newRecord =
score > scores[0];

scores.push(score);

scores.sort(
(a,b)=>b-a
);

scores =
scores.slice(0,3);

saveScores(
scores
);

updateTitle();

document.getElementById(
"finalScore"
).textContent =
score;

document.getElementById(
"finalCoins"
).textContent =
getCoins();

document.getElementById(
"newRecord"
).style.display =

newRecord

?

"block"

:

"none";

document.getElementById(
"gameOver"
).style.display =
"flex";

}

function update(){

if(paused){
return;
}

const head = {

x:
snake[0].x + dx,

y:
snake[0].y + dy

};

if(

head.x < 0 ||
head.y < 0 ||

head.x >= tiles ||
head.y >= tiles

){

gameOver();
return;

}

for(

let i=1;

i<snake.length;

i++

){

if(

snake[i].x ===
head.x &&

snake[i].y ===
head.y

){

gameOver();
return;

}

}

snake.unshift(
head
);

if(

head.x===food.x &&

head.y===food.y

){

score +=
food.value;

document.getElementById(
"score"
).textContent =
score;

showFloatingText(
"+"+
food.value
);

food =
randomFood();

if(
speed > 55
){

speed -= 2;

restartLoop();

}

}else{

snake.pop();

}

draw();

}

function changeDirection(
nx,
ny
){

if(

snake.length > 1 &&

nx===-dx &&

ny===-dy

){

return;

}

dx = nx;
dy = ny;

}

document.getElementById(
"up"
).onclick =
()=>changeDirection(
0,
-1
);

document.getElementById(
"down"
).onclick =
()=>changeDirection(
0,
1
);

document.getElementById(
"left"
).onclick =
()=>changeDirection(
-1,
0
);

document.getElementById(
"right"
).onclick =
()=>changeDirection(
1,
0
);

document.getElementById(
"pauseBtn"
).onclick =
()=>{

paused =
!paused;

document.getElementById(
"pauseOverlay"
).style.display =

paused

?

"flex"

:

"none";

};

canvas.addEventListener(
"touchstart",
e=>{

touchStartX =
e.touches[0].clientX;

touchStartY =
e.touches[0].clientY;

}
);

canvas.addEventListener(
"touchend",
e=>{

const endX =
e.changedTouches[0]
.clientX;

const endY =
e.changedTouches[0]
.clientY;

const dxTouch =
endX -
touchStartX;

const dyTouch =
endY -
touchStartY;

if(
Math.abs(dxTouch) >
Math.abs(dyTouch)
){

if(dxTouch>20){

changeDirection(
1,
0
);

}else if(
dxTouch<-20
){

changeDirection(
-1,
0
);

}

}else{

if(dyTouch>20){

changeDirection(
0,
1
);

}else if(
dyTouch<-20
){

changeDirection(
0,
-1
);

}

}

}
);

document.getElementById(
"startBtn"
).onclick =
()=>{

document.getElementById(
"titleScreen"
).style.display =
"none";

document.getElementById(
"gameScreen"
).style.display =
"flex";

startGame();

};

document.getElementById(
"playAgain"
).onclick =
()=>{

document.getElementById(
"gameOver"
).style.display =
"none";

startGame();

};

document.getElementById(
"backTitle"
).onclick =
()=>{

clearInterval(
loop
);

document.getElementById(
"gameOver"
).style.display =
"none";

document.getElementById(
"gameScreen"
).style.display =
"none";

document.getElementById(
"titleScreen"
).style.display =
"flex";

updateTitle();

};

updateTitle();

</script>

</body>
</html>
