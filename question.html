<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くまの質問生成</title>
<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#bfe9ff;
    color:#2c4a5f;
    text-align:center;
}
.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}
.title{
    background:#7ecdf7;
    color:white;
    border-radius:20px;
    padding:15px;
    font-size:32px;
    font-weight:bold;
    margin-bottom:20px;
}
.kuma-image{
    width:40vw;
    height:40vw;
    min-width:180px;
    min-height:180px;
    max-width:250px;
    max-height:250px;
    object-fit:cover;
    aspect-ratio:1/1;
    border-radius:25px;
}
.label{
    background:#7ecdf7;
    color:white;
    border-radius:15px;
    padding:10px;
    margin:20px auto 10px;
    width:max-content;
}
select,button{
    width:100%;
    border:none;
    border-radius:18px;
    padding:16px;
    font-size:18px;
    background:#98dcff;
    color:white;
    margin-top:10px;
}
button:active{
    transform:scale(0.97);
}
.result{
    background:white;
    border-radius:25px;
    padding:25px;
    margin-top:25px;
}
.copyButton{
    background:white;
    color:#2c4a5f;
}
</style>
</head>
<body>
<div class="container">

<div class="title">くまの質問生成</div>

<img src="kuma.JPG" class="kuma-image">

<div class="label">ジャンルを選択</div>

<select>
<option>すべて</option>
</select>

<button id="generateButton">質問を生成</button>

<div class="result">
<h3>ジャンル</h3>
<div id="genreResult">---</div>

<h3>質問</h3>
<div id="questionResult">---</div>
</div>

<button>もう一回</button>

<button class="copyButton">質問をコピー</button>

</div>

<script>

const questions = {
    "自己紹介": [
        "自分の口癖は？",
        "好きな食べ物",
        "好きな色"
    ],

    "学校・勉強": [
        "勉強の得意教科",
        "テストの最高点数"
    ],

    "趣味・好きなもの": [],

    "恋愛": [
        "今好きな人いる？",
        "理想のタイプは？"
    ],

    "オプ": [],

    "友達・人間関係": [],

    "人生・価値観": [],

    "思い出・エピソード": [],

    "日常・生活": [],

    "自然・季節": []
};

const genreSelect = document.querySelector("select");

Object.keys(questions).forEach(genre => {
    const option = document.createElement("option");
    option.value = genre;
    option.textContent = genre;
    genreSelect.appendChild(option);
});

const generateButton = document.getElementById("generateButton");

generateButton.addEventListener("click", () => {

    const selectedGenre = genreSelect.value;

    let genre;

    if (selectedGenre === "all") {
        const genres = Object.keys(questions);
        genre = genres[Math.floor(Math.random() * genres.length)];
    } else {
        genre = selectedGenre;
    }

    const list = questions[genre];

    if (list.length === 0) {
        document.getElementById("genreResult").textContent = genre;
        document.getElementById("questionResult").textContent = "このジャンルにはまだ質問がありません";
        return;
    }

    const question =
        list[Math.floor(Math.random() * list.length)];

    document.getElementById("genreResult").textContent = genre;
    document.getElementById("questionResult").textContent = question;

});

const rerollButton = document.getElementById("rerollButton");

rerollButton.addEventListener("click", () => {
    generateButton.click();
});
    
</script>

</body>
</html>
