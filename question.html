    margin:0;
    font-family:sans-serif;
    background:#bfe9ff;
    color:#2c4a5f;
    text-align:center;
}
.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}
.title{
    background:#7ecdf7;
    color:white;
    border-radius:20px;
    padding:15px;
    font-size:32px;
    font-weight:bold;
    margin-bottom:20px;
}
.kuma-image{
    width:40vw;
    height:40vw;
    min-width:180px;
    min-height:180px;
    max-width:250px;
    max-height:250px;
    object-fit:cover;
    aspect-ratio:1/1;
    border-radius:25px;
}
.label{
    background:#7ecdf7;
    color:white;
    border-radius:15px;
    padding:10px;
    margin:20px auto 10px;
    width:max-content;
}
select,button{
    width:100%;
    border:none;
    border-radius:18px;
    padding:16px;
    font-size:18px;
    background:#98dcff;
    color:white;
    margin-top:10px;
}
button:active{
    transform:scale(0.97);
}
.result{
    background:white;
    border-radius:25px;
    padding:25px;
    margin-top:25px;
}
.copyButton{
    background:white;
    color:#2c4a5f;
}
</style>
</head>

<div class="title">くまの質問生成</div>

<img src="kuma.PNG" class="kuma-image">

<div class="label">ジャンルを選択</div>

<select>
<option>すべて</option>
</select>

<button id="generateButton">質問を生成</button>

<div class="result">
<h3>ジャンル</h3>
<div id="genreResult">---</div>

<h3>質問</h3>
<div id="questionResult">---</div>
</div>

<button id="rerollButton">もう一回</button>

    <button id="copyButton" class="copyButton">質問をコピー</button>

    <div id="copyMessage"></div>

</div>

const genreSelect = document.querySelector("select");

Object.keys(questions).forEach(genre => {
    const option = document.createElement("option");
    option.value = genre;
    option.textContent = genre;
    genreSelect.appendChild(option);
});

const generateButton = document.getElementById("generateButton");
const rerollButton = document.getElementById("rerollButton");
const copyButton = document.getElementById("copyButton");

generateButton.addEventListener("click", () => {

    if (isRolling) return;

    isRolling = true;

    generateButton.disabled = true;
    rerollButton.disabled = true;

    const selectedGenre = genreSelect.value;

    let genre;

    if (selectedGenre === "all") {
        const genres = Object.keys(questions);
        genre = genres[Math.floor(Math.random() * genres.length)];
    } else {
        genre = selectedGenre;
    }

    const list = questions[genre];

    if (list.length === 0) {

        isRolling = false;

        generateButton.disabled = false;
        rerollButton.disabled = false;

        document.getElementById("genreResult").textContent = genre;
        document.getElementById("questionResult").textContent =
            "このジャンルにはまだ質問がありません";

        return;
    }

    const question =
        list[Math.floor(Math.random() * list.length)];

    let count = 0;

    const roulette = setInterval(() => {

        const genres = Object.keys(questions);

        document.getElementById("genreResult").textContent =
            genres[Math.floor(Math.random() * genres.length)];

        document.getElementById("questionResult").textContent =
            "抽選中...";

        count++;

        if (count >= 15) {

            clearInterval(roulette);

            isRolling = false;

            generateButton.disabled = false;
            rerollButton.disabled = false;

            document.getElementById("genreResult").textContent =
                genre;

            document.getElementById("questionResult").textContent =
                question;
        }

    }, 50);

});

rerollButton.addEventListener("click", () => {
    generateButton.click();
});

copyButton.addEventListener("click", () => {

    const genre =
        document.getElementById("genreResult").textContent;

    const question =
        document.getElementById("questionResult").textContent;

    navigator.clipboard.writeText(
        `ジャンル：${genre}\n\n質問：${question}`
    );

    const copyMessage =
        document.getElementById("copyMessage");

    copyMessage.textContent = "コピーしました！";

    setTimeout(() => {
        copyMessage.textContent = "";
    }, 1000);

});
</script>
