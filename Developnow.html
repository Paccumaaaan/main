<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開発中...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

.bg{
    position:fixed;
    inset:0;
    background:url("chandelier.jpeg") center center/cover no-repeat;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.title{
    color:white;
    font-size:clamp(2rem,5vw,5rem);
    font-weight:bold;
    text-shadow:0 0 20px rgba(255,255,255,0.6);
    animation:pulse 2s infinite;
}

.sub{
    margin-top:20px;
    color:#ddd;
    font-size:clamp(1rem,2vw,1.4rem);
}

@keyframes pulse{
    0%{
        opacity:0.7;
    }
    50%{
        opacity:1;
    }
    100%{
        opacity:0.7;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="overlay">
    <div class="title">
        現在開発中です...
    </div>

    <div class="sub">
        公開までしばらくお待ちください
    </div>
</div>

<audio id="bgm" autoplay loop>
    <source src="bch.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click",()=>{
    document.getElementById("bgm").play();
},{once:true});
</script>

</body>
</html>
