<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開発中...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:sans-serif;
}

#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.title{
    color:white;
    font-size:clamp(2rem,5vw,5rem);
    font-weight:bold;
    text-shadow:0 0 20px rgba(255,255,255,0.8);
    animation:fade 2s infinite;
}

.sub{
    margin-top:20px;
    color:#ddd;
    font-size:clamp(1rem,2vw,1.5rem);
}

.start{
    margin-top:30px;
    padding:12px 24px;
    border:none;
    border-radius:12px;
    font-size:1rem;
    cursor:pointer;
}

@keyframes fade{
    0%{opacity:0.7;}
    50%{opacity:1;}
    100%{opacity:0.7;}
}
</style>
</head>

<body>

<video
    id="bgVideo"
    loop
    playsinline
>
    <source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay">
    <div class="title">現在開発中です...</div>
    <div class="sub">公開までしばらくお待ちください</div>
    <button class="start" onclick="startVideo()">
        タップして再生
    </button>
</div>

<script>
function startVideo(){
    const video=document.getElementById("bgVideo");
    video.play();
    document.querySelector(".start").style.display="none";
}
</script>

</body>
</html>
