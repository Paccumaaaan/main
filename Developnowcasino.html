<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近日公開</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:sans-serif;
}

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

#menu{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.45);
}

.title{
    color:white;
    font-size:clamp(2rem,5vw,5rem);
    margin-bottom:20px;
}

.sub{
    color:#ddd;
    margin-bottom:30px;
}

#playBtn{
    padding:14px 28px;
    border:none;
    border-radius:12px;
    font-size:1rem;
    cursor:pointer;
}
</style>
</head>

<body>

<video id="bgVideo" loop playsinline>
    <source src="bg.mp4" type="video/mp4">
</video>

<div id="menu">
    <div class="title">現在開発中です...</div>
    <div class="sub">公開までしばらくお待ちください</div>

    <button id="playBtn">
        ▶ 予告動画再生する
    </button>
</div>

<script>
const btn=document.getElementById("playBtn");
const menu=document.getElementById("menu");
const video=document.getElementById("bgVideo");

btn.onclick=async()=>{
    menu.remove();

    try{
        await video.play();
    }catch(e){}
};
</script>

</body>
</html>
