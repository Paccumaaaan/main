<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ブロック崩しDX</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(
        180deg,
        #0f2027,
        #203a43,
        #2c5364
    );
}

canvas{
    display:block;
    touch-action:none;
}
</style>
</head>
<body>

<audio id="bgm" loop preload="auto">
    <source src="音源爽快デジタル.mp3" type="audio/mpeg">
</audio>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const bgm = document.getElementById("bgm");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

function startBGM(){
    bgm.volume = 0.4;
    bgm.play().catch(()=>{});
}

document.addEventListener(
    "touchstart",
    startBGM,
    {once:true}
);

document.addEventListener(
    "click",
    startBGM,
    {once:true}
);

function playSE(freq,time=0.08){

    const audio =
    new AudioContext();

    const osc =
    audio.createOscillator();

    const gain =
    audio.createGain();

    osc.type = "square";
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(audio.destination);

    gain.gain.value = 0.05;

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audio.currentTime + time
    );

    osc.stop(audio.currentTime+time);
}

const paddle = {
    width:120,
    height:15,
    x:canvas.width/2-60,
    y:canvas.height-40
};

const ball = {
    x:canvas.width/2,
    y:canvas.height/2,
    r:10,
    dx:5,
    dy:-5
};

const rows = 5;
const cols = 8;
const blockWidth = 40;
const blockHeight = 20;
const padding = 10;

let score = 0;

const colors = [
"#ff4d4d",
"#ff944d",
"#ffff4d",
"#4dff4d",
"#4dd2ff",
"#7d4dff",
"#ff4df2"
];

const blocks = [];

for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

        blocks.push({

            x:c*(blockWidth+padding)+20,
            y:r*(blockHeight+padding)+50,

            w:blockWidth,
            h:blockHeight,

            alive:true,

            color:
            colors[
                (r+c)%colors.length
            ]
        });
    }
}

canvas.addEventListener("touchmove",e=>{

    const touch = e.touches[0];

    paddle.x =
    touch.clientX -
    paddle.width/2;

    if(paddle.x<0)
        paddle.x=0;

    if(
        paddle.x+paddle.width>
        canvas.width
    ){
        paddle.x=
        canvas.width-
        paddle.width;
    }
});

function saveScore(score){

    let ranking =
    JSON.parse(
        localStorage.getItem(
            "breakoutRanking"
        )
    ) || [];

    ranking.push(score);

    ranking.sort(
        (a,b)=>b-a
    );

    ranking =
    ranking.slice(0,10);

    localStorage.setItem(
        "breakoutRanking",
        JSON.stringify(ranking)
    );
}

function drawBlocks(){

    blocks.forEach(block=>{

        if(!block.alive) return;

        ctx.shadowBlur=15;
        ctx.shadowColor=
        block.color;

        ctx.fillStyle=
        block.color;

        ctx.fillRect(
            block.x,
            block.y,
            block.w,
            block.h
        );
    });

    ctx.shadowBlur=0;
}

function collision(){

    blocks.forEach(block=>{

        if(!block.alive)
            return;

        if(

            ball.x > block.x &&
            ball.x < block.x+block.w &&

            ball.y > block.y &&
            ball.y < block.y+block.h

        ){

            block.alive=false;

            ball.dy*=-1;

            score+=100;

            playSE(700);

            const remain =
            blocks.filter(
                b=>b.alive
            ).length;

            if(remain===0){

                score+=5000;

                saveScore(score);

                alert(
                    "ステージクリア！\n"+
                    "スコア:"+score
                );

                location.reload();
            }
        }
    });
}

function update(){

    ball.x+=ball.dx;
    ball.y+=ball.dy;

    if(
        ball.x<ball.r ||
        ball.x>
        canvas.width-ball.r
    ){
        ball.dx*=-1;
    }

    if(ball.y<ball.r){
        ball.dy*=-1;
    }

    if(

        ball.y+ball.r>
        paddle.y &&

        ball.x>
        paddle.x &&

        ball.x<
        paddle.x+
        paddle.width

    ){

        ball.dy=
        -Math.abs(ball.dy);

        playSE(300);
    }

    if(ball.y>canvas.height){

        playSE(120,0.4);

        saveScore(score);

        alert(
            "ゲームオーバー\n"+
            "スコア:"+score
        );

        location.reload();
    }

    collision();
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBlocks();

    ctx.fillStyle="white";

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.shadowBlur=20;
    ctx.shadowColor="orange";

    ctx.fillStyle="orange";
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="white";

    ctx.font=
    "bold 24px sans-serif";

    ctx.fillText(
        "Score : "+score,
        20,
        30
    );

    const ranking =
    JSON.parse(
        localStorage.getItem(
            "breakoutRanking"
        )
    ) || [];

    ctx.font=
    "14px sans-serif";

    ctx.fillText(
        "RANKING",
        20,
        60
    );

    ranking.forEach((s,i)=>{

        ctx.fillText(

            `${i+1}. ${s}`,

            20,

            85+i*18

        );
    });
}

function loop(){

    update();
    draw();

    requestAnimationFrame(
        loop
    );
}

loop();

</script>
</body>
</html>
