<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Casino Deluxe</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:sans-serif;
    text-align:center;
    margin:0;
}

h1{
    margin-top:20px;
}

.panel{
    background:#1e293b;
    margin:15px auto;
    padding:15px;
    border-radius:12px;
    width:min(90%,900px);
}

button{
    padding:10px 16px;
    margin:4px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.red{
    background:#dc2626;
    color:white;
}

.blue{
    background:#2563eb;
    color:white;
}

.black{
    background:#111;
    color:white;
}

.gold{
    background:gold;
    color:black;
}

input{
    padding:8px;
    border-radius:6px;
}

#overlay{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:60px;
    font-weight:bold;
    z-index:9999;
}

#message{
    font-size:24px;
    margin:20px;
}

.flash{
    animation:flash .3s 6;
}

@keyframes flash{
    50%{
        filter:brightness(2);
    }
}

canvas{
    background:white;
    border-radius:50%;
}

</style>
</head>

<body>

<div id="overlay"></div>

<h1>🎰 CASINO DELUXE 🎰</h1>

<h2>
メダル:
<span id="medals">100</span>
</h2>

<div id="message"></div>

<div class="panel">

<h2>🔴 RED or BLUE 🔵</h2>

<input
id="rbBet"
type="number"
value="10"
min="1">

<br><br>

<button
class="red"
onclick="playRedBlue('赤')">
赤
</button>

<button
class="blue"
onclick="playRedBlue('青')">
青
</button>

</div>

<div class="panel">

<h2>🎡 ルーレット</h2>

<canvas
id="rouletteCanvas"
width="420"
height="420">
</canvas>

<br><br>

賭け枚数

<input
id="rouletteBet"
type="number"
value="10"
min="1">

<br><br>

数字予想

<input
id="numberBet"
type="number"
value="7"
min="0"
max="36">

<br><br>

<button
class="red"
onclick="spinRoulette('赤')">

赤に賭ける

</button>

<button
class="black"
onclick="spinRoulette('黒')">

黒に賭ける

</button>

<div id="rouletteResult">

ルーレット準備完了

</div>

</div>

<div class="panel" id="stonePanel" style="display:none;">

<h2>🪨 救済システム</h2>

<p>
メダルが無くなりました！
</p>

<p>
石を100回クリックすると
メダル1枚獲得
</p>

<button
id="stoneBtn"
onclick="mineStone()">

🪨

</button>

<div id="stoneCount">

0 / 100

</div>

</div>
    
<script>

let medals =
Number(
localStorage.medals || 100
);

function saveData(){

    localStorage.medals =
    medals;

    document
    .getElementById(
        "medals"
    )
    .textContent =
    medals;

updateStonePanel();
    
}

saveData();

function showMessage(
text
){

    document
    .getElementById(
        "message"
    )
    .innerHTML =
    text;
}

function flashWin(){

    document.body
    .classList.add(
        "flash"
    );

    setTimeout(()=>{

        document.body
        .classList.remove(
            "flash"
        );

    },1800);
}

function playRedBlue(
choice
){

    let bet =
    Number(
    document
    .getElementById(
    "rbBet"
    ).value
    );

    if(
    bet < 1
    ||
    bet > medals
    ){
        return;
    }

    const overlay =
    document
    .getElementById(
    "overlay"
    );

    overlay.style.display =
    "flex";

    overlay.style.color =
    "white";

    overlay.textContent =
    "選ばれた色は……";

    setTimeout(()=>{

        let result =

        Math.random() < 0.5

        ? "赤"

        : "青";

        overlay.textContent =
        result;

        overlay.style.color =

        result === "赤"

        ? "red"

        : "deepskyblue";

        if(
        result === choice
        ){

            medals += bet;

            flashWin();

            showMessage(
            "🎉 勝利！ +"
            + bet +
            "枚"
            );

        }else{

            medals -= bet;

            showMessage(
            "💀 敗北 -"
            + bet +
            "枚"
            );
        }

        saveData();

        setTimeout(()=>{

            overlay.style.display =
            "none";

        },1200);

    },1500);
}

const rouletteCanvas =
document.getElementById(
"rouletteCanvas"
);

const rouletteCtx =
rouletteCanvas.getContext(
"2d"
);

const rouletteNumbers = [

0,
32,15,19,4,21,2,25,17,34,
6,27,13,36,11,30,8,23,10,
5,24,16,33,1,20,14,31,
9,22,18,29,7,28,12,35,
3,26

];

const redNumbers = [

1,3,5,7,9,
12,14,16,18,
19,21,23,25,
27,30,32,34,36

];

let rouletteAngle = 0;

function drawRoulette(){

const ctx =
rouletteCtx;

ctx.clearRect(
0,
0,
420,
420
);

const center = 210;

const radius = 180;

const step =
(Math.PI * 2) / 37;

for(
let i=0;
i<37;
i++
){

const num =
rouletteNumbers[i];

ctx.beginPath();

ctx.moveTo(
center,
center
);

ctx.arc(
center,
center,
radius,

rouletteAngle +
i * step,

rouletteAngle +
(i+1) * step
);

if(num===0){

ctx.fillStyle =
"green";

}else if(
redNumbers.includes(
num
)
){

ctx.fillStyle =
"red";

}else{

ctx.fillStyle =
"black";
}

ctx.fill();

const angle =

rouletteAngle +

i*step +

step/2;

ctx.save();

ctx.translate(

center +

Math.cos(angle)*140,

center +

Math.sin(angle)*140

);

ctx.rotate(
angle +
Math.PI/2
);

ctx.fillStyle =
"white";

ctx.font =
"12px sans-serif";

ctx.textAlign =
"center";

ctx.fillText(
num,
0,
0
);

ctx.restore();
}

ctx.beginPath();

ctx.arc(
center,
center,
60,
0,
Math.PI*2
);

ctx.fillStyle =
"#444";

ctx.fill();

ctx.fillStyle =
"gold";

ctx.fillRect(
200,
0,
20,
50
);
}

drawRoulette();

function spinRoulette(selectedColor){

const bet =
Number(
document.getElementById(
"rouletteBet"
).value
);

if(
bet < 1 ||
bet > medals
){
return;
}

const selectedNumber =
Number(
document.getElementById(
"numberBet"
).value
);

const startAngle =
rouletteAngle;

const targetAngle =

rouletteAngle +

(Math.PI * 20) +

(Math.random() * 6);

const startTime =
performance.now();

function animate(now){

const progress =

Math.min(
(now - startTime)
/ 5000,
1
);

const ease =

1 -
Math.pow(
1 - progress,
3
);

rouletteAngle =

startAngle +

(
targetAngle -
startAngle
)

* ease;

drawRoulette();

let stoneClicks = 0;

function updateStonePanel(){

const panel =
document.getElementById(
"stonePanel"
);

if(medals <= 0){

panel.style.display =
"block";

}else{

panel.style.display =
"none";

}

}

function mineStone(){

stoneClicks++;

document
.getElementById(
"stoneCount"
)
.innerHTML =

stoneClicks +
" / 100";

if(stoneClicks >= 100){

stoneClicks = 0;

medals++;

saveData();

document
.getElementById(
"stoneCount"
)
.innerHTML =

"0 / 100";

showMessage(
"🪨 メダル1枚獲得！"
);

}

updateStonePanel();
}

    
if(progress < 1){

requestAnimationFrame(
animate
);

}else{

finishRoulette(
selectedColor,
selectedNumber,
bet
);

}
}

requestAnimationFrame(
animate
);
}

function finishRoulette(

selectedColor,
selectedNumber,
bet

){

const result =

rouletteNumbers[
Math.floor(
Math.random()*37
)
];

let resultColor;

if(result===0){

resultColor =
"緑";

}else if(

redNumbers.includes(
result
)

){

resultColor =
"赤";

}else{

resultColor =
"黒";
}

let reward = 0;

if(
resultColor ===
selectedColor
){

reward +=
bet * 2;
}

if(
result ===
selectedNumber
){

reward +=
bet * 20;
}

medals +=
reward -
bet;

saveData();

document
.getElementById(
"rouletteResult"
)
.innerHTML =

"結果: " +
result +

" (" +
resultColor +
")<br>" +

"獲得: " +
reward +
"枚";
}
    
</script>

</body>
</html>
