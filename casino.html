<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Casino Deluxe</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:sans-serif;
    text-align:center;
    margin:0;
}

h1{
    margin-top:20px;
}

.panel{
    background:#1e293b;
    margin:15px auto;
    padding:15px;
    border-radius:12px;
    width:min(90%,900px);
}

button{
    padding:10px 16px;
    margin:4px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.red{
    background:#dc2626;
    color:white;
}

.blue{
    background:#2563eb;
    color:white;
}

.black{
    background:#111;
    color:white;
}

.gold{
    background:gold;
    color:black;
}

input{
    padding:8px;
    border-radius:6px;
}

#overlay{
    position:fixed;
    inset:0;
    background:black;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:60px;
    font-weight:bold;
    z-index:9999;
}

#message{
    font-size:24px;
    margin:20px;
}

.flash{
    animation:flash .3s 6;
}

@keyframes flash{
    50%{
        filter:brightness(2);
    }
}

canvas{
    background:white;
    border-radius:50%;
}

</style>
</head>

<body>

<div id="overlay"></div>

<h1>🎰 CASINO DELUXE 🎰</h1>

<h2>
メダル:
<span id="medals">100</span>
</h2>

<div id="message"></div>

<div class="panel">

<h2>🔴 RED or BLUE 🔵</h2>

<input
id="rbBet"
type="number"
value="10"
min="1">

<br><br>

<button
class="red"
onclick="playRedBlue('赤')">

赤

</button>

<button
class="blue"
onclick="playRedBlue('青')">

青

</button>

</div>

<script>

let medals=
Number(
localStorage.medals
|| 100
);

function saveData(){

    localStorage.medals=
    medals;

    document
    .getElementById(
        "medals"
    )
    .textContent=
    medals;
}

saveData();

function showMessage(
text
){

    document
    .getElementById(
        "message"
    )
    .innerHTML=
    text;
}

function flashWin(){

    document.body
    .classList.add(
        "flash"
    );

    setTimeout(()=>{

        document.body
        .classList.remove(
            "flash"
        );

    },1800);
}

function playRedBlue(
choice
){

    let bet=
    Number(
    document
    .getElementById(
    "rbBet"
    ).value
    );

    if(
    bet<1
    ||
    bet>medals
    ){
        return;
    }

    const overlay=
    document
    .getElementById(
    "overlay"
    );

    overlay.style.display=
    "flex";

    overlay.style.color=
    "white";

    overlay.textContent=
    "選ばれた色は……";

    setTimeout(()=>{

        let result=

        Math.random()<0.5

        ? "赤"

        : "青";

        overlay.textContent=
        result;

        overlay.style.color=

        result==="赤"

        ? "red"

        : "deepskyblue";

        if(
        result===choice
        ){

            medals+=bet;

            flashWin();

            showMessage(
            "🎉 勝利！ +"
            +bet+
            "枚"
            );

        }else{

            medals-=bet;

            showMessage(
            "💀 敗北 -"
            +bet+
            "枚"
            );
        }

        saveData();

        setTimeout(()=>{

            overlay.style.display=
            "none";

        },1200);

    },1500);
}

</script>

</body>
</html>
