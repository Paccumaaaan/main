<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casino Deluxe</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:sans-serif;text-align:center}
.header{background:#141b34;padding:15px;box-shadow:0 0 20px #000}
.card{background:#1b2445;margin:15px auto;padding:15px;border-radius:12px;max-width:900px}
button{padding:10px 16px;margin:5px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.red{background:#d33;color:#fff}.blue{background:#39f;color:#fff}.black{background:#222;color:#fff}
.gold{background:gold;color:#000}
#roulette{background:#fff;border-radius:50%;margin:auto;display:block}
.win{animation:flash .4s 6}
@keyframes flash{50%{filter:brightness(2)}}
.shake{animation:shake .2s 5}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="header">
<h1>🎰 CASINO DELUXE 🎰</h1>
<h2>メダル: <span id="medals">100</span></h2>
<h3>連勝: <span id="streak">0</span></h3>
</div>

<div class="card">
<h2>🔴🔵 赤青ゲーム</h2>
<input id="bet1" type="number" value="10" min="1">
<br>
<button class="red" onclick="redBlue('赤')">赤</button>
<button class="blue" onclick="redBlue('青')">青</button>
</div>

<div class="card">
<h2>🎡 ルーレット</h2>
<canvas id="roulette" width="320" height="320"></canvas><br>
<input id="bet2" type="number" value="10" min="1">
<br>
<button class="red" onclick="spinRoulette('赤')">赤に賭ける</button>
<button class="black" onclick="spinRoulette('黒')">黒に賭ける</button>
<div id="doubleup" style="display:none">
<h3>勝利！</h3>
<button class="gold" onclick="cashOut()">降りる</button>
<button onclick="doubleUp()">もう一回勝負</button>
</div>
</div>

<div class="card" id="rescue" style="display:none">
<h2>🪨 救済処置</h2>
<button onclick="mine()">石を叩く</button>
<p><span id="stone">0</span>/100</p>
</div>

<div class="card">
<button onclick="resetGame()">データリセット</button>
</div>

<h2 id="msg"></h2>

<script>
let medals=Number(localStorage.medals||100);
let streak=Number(localStorage.streak||0);
let stone=0;
let pendingWin=0;
let angle=0;

const c=document.getElementById("roulette");
const ctx=c.getContext("2d");

function save(){
 localStorage.medals=medals;
 localStorage.streak=streak;
 update();
}

function update(){
 medals=Math.floor(medals);
 document.getElementById("medals").textContent=medals;
 document.getElementById("streak").textContent=streak;
 document.getElementById("rescue").style.display=medals<=0?"block":"none";
}

function message(t){document.getElementById("msg").innerHTML=t;}

function celebrate(){
 document.body.classList.add("win");
 setTimeout(()=>document.body.classList.remove("win"),2500);
}

function fail(){
 document.body.classList.add("shake");
 setTimeout(()=>document.body.classList.remove("shake"),1000);
}

function redBlue(choice){
 let bet=+document.getElementById("bet1").value;
 if(bet<1||bet>medals)return;
 let result=Math.random()<0.5?"赤":"青";
 if(result===choice){
   medals+=bet;
   streak++;
   celebrate();
   message("🎉当たり！ "+result);
 }else{
   medals-=bet;
   streak=0;
   fail();
   message("💀ハズレ！ "+result);
 }
 save();
}

function drawRoulette(rot=0){
 ctx.clearRect(0,0,320,320);
 let colors=["red","black","red","black","red","black","green"];
 let step=Math.PI*2/colors.length;
 for(let i=0;i<colors.length;i++){
   ctx.beginPath();
   ctx.moveTo(160,160);
   ctx.arc(160,160,150,rot+i*step,rot+(i+1)*step);
   ctx.fillStyle=colors[i];
   ctx.fill();
 }
 ctx.beginPath();
 ctx.arc(160,160,30,0,Math.PI*2);
 ctx.fillStyle="white";
 ctx.fill();
 ctx.fillStyle="gold";
 ctx.fillRect(150,0,20,40);
}

drawRoulette();

function spinRoulette(choice){
 let bet=+document.getElementById("bet2").value;
 if(bet<1||bet>medals)return;

 let start=angle;
 let end=angle+Math.PI*10+Math.random()*Math.PI*4;
 let startTime=performance.now();

 function anim(t){
   let p=Math.min((t-startTime)/3000,1);
   angle=start+(end-start)*(1-(1-p)*(1-p));
   drawRoulette(angle);
   if(p<1) requestAnimationFrame(anim);
   else finish(choice,bet);
 }
 requestAnimationFrame(anim);
}

function finish(choice,bet){
 let result=Math.random()<0.486?(Math.random()<0.5?"赤":"黒"):"緑";

 if(result===choice){
   pendingWin=bet*2;
   document.getElementById("doubleup").style.display="block";
   message("🎉ルーレット勝利！結果:"+result+" 獲得候補:"+pendingWin);
   celebrate();
 }else{
   medals-=bet;
   streak=0;
   message("💀負け！結果:"+result);
   fail();
   save();
 }
}

function cashOut(){
 medals+=pendingWin;
 streak++;
 pendingWin=0;
 document.getElementById("doubleup").style.display="none";
 save();
}

function doubleUp(){
 let win=Math.random()<0.5;
 if(win){
   pendingWin*=2;
   message("🔥成功！現在 "+pendingWin+"枚");
   celebrate();
 }else{
   pendingWin=0;
   streak=0;
   document.getElementById("doubleup").style.display="none";
   message("💀ダブルアップ失敗！");
   fail();
   save();
 }
}

function mine(){
 if(medals>0)return;
 stone++;
 document.getElementById("stone").textContent=stone;
 if(stone>=100){
   medals++;
   stone=0;
   document.getElementById("stone").textContent=0;
   message("⛏️ メダル1枚獲得！");
   save();
 }
}

function resetGame(){
 localStorage.clear();
 medals=100; streak=0; pendingWin=0;
 save();
}

update();
</script>
</body>
</html>
