<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakout</title>
<style>
body{margin:0;background:#08111f;color:#fff;font-family:sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<audio id="bgm" loop preload="auto">
<source src="adgjmptw.mp3" type="audio/mpeg">
</audio>
<canvas id="game"></canvas>
<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener("resize",rs);

let state="title",score=0,combo=0,life=3,stage=1,hiscore=+localStorage.breakoutHiscore||0;
const rank=()=>JSON.parse(localStorage.breakoutRanking||"[]");
function saveScore(s){
 let r=rank(); r.push(s); r.sort((a,b)=>b-a); r=r.slice(0,10);
 localStorage.breakoutRanking=JSON.stringify(r);
 localStorage.breakoutHiscore=Math.max(hiscore,s);
}

const paddle={w:120,h:16,x:100,y:0};
const ball={x:0,y:0,r:10,dx:5,dy:-5};

let blocks=[],particles=[];

function resetStage(){
 blocks=[];
 let cols=Math.max(6,Math.floor(c.width/70));
 let bw=(c.width-40)/cols-8;
 let rows=4+stage;
 for(let r=0;r<rows;r++){
   for(let k=0;k<cols;k++){
     blocks.push({x:20+k*(bw+8),y:70+r*28,w:bw,h:20,a:1,
      color:`hsl(${(r*40+k*20)%360} 100% 60%)`});
   }
 }
 paddle.x=c.width/2-paddle.w/2;
 paddle.y=c.height-50;
 ball.x=c.width/2; ball.y=c.height-100;
 ball.dx=4+stage*0.5; ball.dy=-(4+stage*0.5);
}

function se(f,t=.08){
 const ac=new(window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain();
 o.frequency.value=f;o.connect(g);g.connect(ac.destination);
 g.gain.value=.05;o.start();
 g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t);
 o.stop(ac.currentTime+t);
}

function startGame(){
 document.getElementById("bgm").volume=.4;
 document.getElementById("bgm").play().catch(()=>{});
 score=0;combo=0;life=3;stage=1;
 resetStage(); state="play";
}

function burst(x,y,col){
 for(let i=0;i<12;i++) particles.push({
  x,y,dx:(Math.random()-.5)*6,dy:(Math.random()-.5)*6,l:30,c:col
 });
}

c.addEventListener("touchmove",e=>{
 paddle.x=e.touches[0].clientX-paddle.w/2;
});
c.addEventListener("mousemove",e=>{
 paddle.x=e.clientX-paddle.w/2;
});
addEventListener("click",()=>{ if(state==="title") startGame(); });

function update(){
 if(state!=="play") return;

 ball.x+=ball.dx; ball.y+=ball.dy;

 if(ball.x<ball.r||ball.x>c.width-ball.r) ball.dx*=-1;
 if(ball.y<ball.r) ball.dy*=-1;

 if(ball.y+ball.r>paddle.y && ball.x>paddle.x && ball.x<paddle.x+paddle.w){
   ball.dy=-Math.abs(ball.dy);
   combo++;
   se(300);
 }

 for(let i=blocks.length-1;i>=0;i--){
   let b=blocks[i];
   if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){
      ball.dy*=-1;
      blocks.splice(i,1);
      burst(ball.x,ball.y,b.color);
      score+=100*(1+Math.floor(combo/5));
      se(700);
   }
 }

 if(blocks.length===0){
   score+=5000;
   stage++;
   resetStage();
 }

 if(ball.y>c.height+30){
   life--; combo=0; se(120,.3);
   ball.x=c.width/2; ball.y=c.height-100;
   if(life<=0){
      saveScore(score);
      state="gameover";
   }
 }

 particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.l--;});
 particles=particles.filter(p=>p.l>0);
}

function draw(){
 ctx.clearRect(0,0,c.width,c.height);

 let g=ctx.createLinearGradient(0,0,0,c.height);
 g.addColorStop(0,"#0f2027");g.addColorStop(.5,"#203a43");g.addColorStop(1,"#2c5364");
 ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);

 if(state==="title"){
   ctx.fillStyle="#ffffff";
   ctx.textAlign="center";

   ctx.font="bold 48px sans-serif";
   ctx.fillText(
      "BREAKOUT DX",
      c.width/2,
      c.height/2-40
   );

   ctx.font="24px sans-serif";
   ctx.fillText(
      "タップしてスタート",
      c.width/2,
      c.height/2+20
   );

   return;
}

 blocks.forEach(b=>{
   ctx.fillStyle=b.color;
   ctx.shadowBlur=15; ctx.shadowColor=b.color;
   ctx.fillRect(b.x,b.y,b.w,b.h);
 });

 ctx.shadowBlur=0;
 ctx.fillStyle="#fff";
 ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fillStyle="orange";
 ctx.shadowBlur=20; ctx.shadowColor="orange";
 ctx.fill();
 ctx.shadowBlur=0;

 particles.forEach(p=>{
   ctx.fillStyle=p.c;
   ctx.fillRect(p.x,p.y,3,3);
 });

 ctx.fillStyle="#fff";
 ctx.textAlign="left";
 ctx.font="20px sans-serif";
 ctx.fillText("Score "+score,10,28);
 ctx.fillText("Life "+life,10,52);
 ctx.fillText("Combo "+combo,10,76);
 ctx.fillText("Stage "+stage,10,100);

 if(state==="gameover"){
   ctx.textAlign="center";
   ctx.font="bold 42px sans-serif";
   ctx.fillText("GAME OVER",c.width/2,c.height/2-50);
   ctx.font="24px sans-serif";
   ctx.fillText("Score "+score,c.width/2,c.height/2);
   let r=rank();
   r.slice(0,5).forEach((s,i)=>ctx.fillText(`${i+1}. ${s}`,c.width/2,c.height/2+50+i*28));
 }
}

(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
