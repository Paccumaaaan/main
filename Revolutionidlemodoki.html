<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revolution Style Prototype</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.top{text-align:center;padding:12px}
.score{font-size:54px;font-weight:700}
.rate{font-size:24px}
.main{display:flex;flex-direction:column;align-items:center}
canvas{max-width:90vw}
.bar{
width:min(700px,92vw);
height:28px;
background:#30003d;
border-radius:999px;
overflow:hidden;
margin:12px 0;
border:2px solid #ff00ff;
}
.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#c000ff,#ff00ff);
}
.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
margin:10px;
}
button{
border:none;
border-radius:10px;
padding:12px 16px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}
.buyall{background:#222;color:#fff}
.asc{background:#32d400;color:#000}
.grid{
display:grid;
grid-template-columns:repeat(3,minmax(180px,1fr));
gap:10px;
width:min(900px,95vw);
margin-bottom:20px;
}
.card{
padding:10px;
border-radius:10px;
cursor:pointer;
text-align:center;
font-weight:bold;
}
@media(max-width:700px){
.grid{grid-template-columns:repeat(2,minmax(120px,1fr));}
}
</style>
</head>
<body>
<div class="top">
<div class="score" id="score">e0</div>
<div class="rate" id="rate">+e0/s</div>
</div>

<div class="main">
<canvas id="cv" width="700" height="700"></canvas>

<div style="font-size:22px" id="ascText">×10まで: 0%</div>

<div class="bar"><div class="fill" id="fill"></div></div>

<div class="actions">
<button class="buyall" id="buyAll">すべて購入</button>
<button class="asc" id="ascBtn">アセンション</button>
</div>

<div id="req"></div>

<div class="grid" id="shop"></div>
</div>

<script>
const colors=["#ff2222","#ff7f00","#ffee00","#59ff00","#18fff0","#1828ff","#5b16ff","#ff00ff","#7f00ff","#ffffff"];
let score=100;
let asc=0;
let mult=1;

const rings=[];
for(let i=0;i<10;i++) rings.push({lvl:0});

function fmt(n){
if(n<1000)return Math.floor(n);
const e=Math.floor(Math.log10(n));
const m=n/10**e;
return "e"+e+" ("+m.toFixed(2)+")";
}

function cost(i){
return Math.floor((i+1)*10*Math.pow(1.18,rings[i].lvl));
}

function ringPower(i){
return Math.max(1,1+rings[i].lvl*0.05);
}

function production(){
let p=1;
for(let i=0;i<10;i++) p*=ringPower(i);
return p*mult;
}

function reqLevel(){
return 100+asc*5;
}

function updateShop(){
const s=document.getElementById("shop");
s.innerHTML="";
for(let i=0;i<10;i++){
const d=document.createElement("div");
d.className="card";
d.style.background=colors[i];
d.style.color=i===2||i===9?"#000":"#fff";
d.innerHTML=`Lv.${rings[i].lvl}<br>Cost ${fmt(cost(i))}<br>×${ringPower(i).toFixed(2)}`;
d.onclick=()=>buy(i);
s.appendChild(d);
}
}

function buy(i){
const c=cost(i);
if(score>=c){
score-=c;
rings[i].lvl++;
refresh();
}
}

document.getElementById("buyAll").onclick=()=>{
let bought=true;
while(bought){
bought=false;
for(let i=0;i<10;i++){
if(score>=cost(i)){
score-=cost(i);
rings[i].lvl++;
bought=true;
}
}
}
refresh();
};

document.getElementById("ascBtn").onclick=()=>{
if(rings.every(r=>r.lvl>=reqLevel())){
asc++;
mult*=10;
score=100;
rings.forEach(r=>r.lvl=0);
refresh();
}
};

function refresh(){
document.getElementById("score").textContent=fmt(score);
document.getElementById("rate").textContent="+"+fmt(production())+"/s";
document.getElementById("req").textContent="必要Lv "+reqLevel()+" | Ascension "+asc+" | Mult ×"+mult;

const prog=Math.min(rings.reduce((a,b)=>a+b.lvl,0)/(reqLevel()*10),1);
document.getElementById("fill").style.width=(prog*100)+"%";
document.getElementById("ascText").textContent="×10まで: "+(prog*100).toFixed(1)+"%";

updateShop();
}

setInterval(()=>{
score+=production()/10;
refresh();
},100);

const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
let rot=0;

function draw(){
ctx.clearRect(0,0,700,700);
rot+=0.005+Math.log10(production()+1)*0.002;

for(let i=9;i>=0;i--){
ctx.beginPath();
ctx.strokeStyle=colors[i];
ctx.lineWidth=16;
ctx.shadowBlur=12;
ctx.shadowColor=colors[i];
ctx.arc(350,350,45+i*28,rot*(1+i*0.05),rot*(1+i*0.05)+Math.PI*2);
ctx.stroke();
}
requestAnimationFrame(draw);
}
refresh();
draw();
</script>
</body>
</html>
