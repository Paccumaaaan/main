<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paccumaaaan Gum Factory</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#171717;
color:white;
font-family:sans-serif;
padding-bottom:80px;
}

header{
position:sticky;
top:0;
background:#222;
padding:12px;
border-bottom:2px solid #333;
z-index:100;
}

.stats{
display:flex;
gap:10px;
overflow:auto;
}

.stat{
background:#2d2d2d;
padding:10px 15px;
border-radius:12px;
white-space:nowrap;
}

.factoryArea{
position:relative;
max-width:1200px;
margin:auto;
padding:20px;
}

.factoryImage{
width:100%;
display:block;
image-rendering:pixelated;
}

.gummyLayer{
position:absolute;
inset:20px;
overflow:hidden;
pointer-events:none;
}

.gummy{
position:absolute;
font-size:24px;
animation-name:move;
animation-timing-function:linear;
animation-iteration-count:infinite;
}

@keyframes move{
from{
left:-5%;
}
to{
left:105%;
}
}

.panel{
max-width:1200px;
margin:0 auto 20px;
background:#222;
padding:15px;
border-radius:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
}

.card{
background:#303030;
padding:12px;
border-radius:12px;
}

.skillTree{
display:flex;
justify-content:center;
padding:20px;
overflow:auto;
}

.node{
width:70px;
height:70px;
border-radius:50%;
background:#333;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
border:3px solid #555;
cursor:pointer;
transition:.2s;
}

.node.unlocked{
background:#4caf50;
border-color:#7cff84;
}

.node.locked{
opacity:.4;
}

.row{
display:flex;
justify-content:center;
gap:20px;
margin:15px 0;
}

.tabs{
position:fixed;
bottom:0;
left:0;
right:0;
display:grid;
grid-template-columns:repeat(4,1fr);
background:#222;
border-top:2px solid #333;
}

.tab{
padding:12px;
text-align:center;
}
</style>
</head>

<body>

<header>
<div class="stats">
<div class="stat">🍬 <span id="gum">1.28e245</span></div>
<div class="stat">⚡ <span id="speed">125</span></div>
<div class="stat">⭐ PP 250K</div>
<div class="stat">🏆 Promote 12</div>
<div class="stat">🌳 SP <span id="sp">15</span></div>
</div>
</header>

<div class="factoryArea">

<img
id="factoryImage"
class="factoryImage"
src="RainbowFactory.png"
>

<div
class="gummyLayer"
id="gummyLayer"
></div>

</div>

<div class="panel">
<h2>🏭 工場設備</h2>

<div class="grid">

<div class="card">
🤖 オートクリッカー Lv.50
</div>

<div class="card">
⚙️ 圧縮機 Lv.25
</div>

<div class="card">
🏭 生産ライン Lv.10
</div>

<div class="card">
📦 出荷センター Lv.5
</div>

</div>
</div>

<div class="panel">

<h2>🌳 スキルツリー</h2>

<div class="skillTree">

<div>

<div class="row">
<div
class="node unlocked"
id="up1"
onclick="buyNode('up1',5)"
>
⚡
</div>
</div>

<div class="row">

<div
class="node locked"
id="left1"
onclick="buyNode('left1',5)"
>
⭐
</div>

<div
class="node unlocked"
id="center"
>
🏭
</div>

<div
class="node locked"
id="right1"
onclick="buyNode('right1',5)"
>
⚙️
</div>

</div>

<div class="row">
<div
class="node locked"
id="down1"
onclick="buyNode('down1',5)"
>
🔓
</div>
</div>

</div>

</div>

</div>

<div class="panel">

<h2>🎯 マイルストーン</h2>

<div class="card">
✅ ゴールデングミ解禁
</div>

<div class="card">
✅ 工場暴走解禁
</div>

<div class="card">
🔒 研究所解禁
</div>

</div>

<div class="tabs">
<div class="tab">🏭<br>設備</div>
<div class="tab">⭐<br>転生</div>
<div class="tab">🌳<br>スキル</div>
<div class="tab">📖<br>実績</div>
</div>

<script>

let sp = 15;

let speedLevel = 125;
let gummyCount = 10;

function spawnGummies(){

const layer =
document.getElementById(
"gummyLayer"
);

layer.innerHTML = "";

for(
let i=0;
i<gummyCount;
i++
){

const gummy =
document.createElement("div");

gummy.className =
"gummy";

const line =
i % 3;

gummy.style.top =
(35 + line * 16) + "%";

gummy.style.animationDuration =
(8 / speedLevel * 100) + "s";

gummy.style.animationDelay =
(-Math.random()*5) + "s";

gummy.textContent =
"🍬";

layer.appendChild(
gummy
);

}

}

function buyNode(
id,
cost
){

if(sp < cost)
return;

const node =
document.getElementById(id);

if(
node.classList.contains(
"unlocked"
)
)
return;

sp -= cost;

document.getElementById(
"sp"
).textContent = sp;

node.classList.remove(
"locked"
);

node.classList.add(
"unlocked"
);

if(id==="up1"){
speedLevel += 50;
}

if(id==="right1"){
gummyCount += 10;
}

if(id==="down1"){

const milestone =
document.querySelector(
".panel:last-of-type"
);

const card =
document.createElement(
"div"
);

card.className =
"card";

card.textContent =
"✅ 工場AI解禁";

milestone.appendChild(
card
);

}

spawnGummies();

}

spawnGummies();

</script>

</body>
</html>
