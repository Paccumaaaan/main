<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paccumaaaan Gum Factory</title>
<style>
body{
margin:0;
font-family:sans-serif;
background:#10141f;
color:white;
text-align:center;
}
h1{
margin-top:20px;
}
#gum{
font-size:40px;
margin:20px;
}
button{
padding:12px 20px;
margin:5px;
font-size:16px;
cursor:pointer;
border:none;
border-radius:8px;
}
.main{
max-width:900px;
margin:auto;
}
.panel{
background:#1a2133;
padding:15px;
margin:10px;
border-radius:12px;
}
</style>
</head>
<body>

<div class="main">

<h1>Paccumaaaan Gum Factory</h1>

<div id="gum">0 グミ</div>

<button onclick="clickGum()">グミを作る</button>

<div class="panel">
<h2>設備</h2>

<button onclick="buyAuto()">
オートクリッカー
Lv.<span id="autoLv">0</span>
(<span id="autoCost">10</span>)
</button>

<button onclick="buyPower()">
圧縮機
Lv.<span id="powerLv">0</span>
(<span id="powerCost">25</span>)
</button>

<button onclick="buyLine()">
生産ライン
Lv.<span id="lineLv">0</span>
(<span id="lineCost">100</span>)
</button>

</div>

<div class="panel">
<h2>プレステージ</h2>

<div>
PP:
<span id="pp">0</span>
</div>

<button onclick="prestige()">
プレステージ
</button>

</div>

</div>

<script>
let gum=0;
let totalGum=0;

let autoLv=0;
let powerLv=0;
let lineLv=0;

let pp=0;

let autoCost=10;
let powerCost=25;
let lineCost=100;

let lastTime=Date.now();

function gainPerClick(){
return (1+powerLv)*(1+pp);
}

function gainPerSecond(){
return autoLv*(1+powerLv)*(1+lineLv)*(1+pp);
}

function format(n){
if(n<1000)return Math.floor(n);
return n.toExponential(2);
}

function clickGum(){
let gain=gainPerClick();
gum+=gain;
totalGum+=gain;
}

function buyAuto(){
if(gum<autoCost)return;
gum-=autoCost;
autoLv++;
autoCost=Math.floor(autoCost*1.15);
}

function buyPower(){
if(gum<powerCost)return;
gum-=powerCost;
powerLv++;
powerCost=Math.floor(powerCost*1.2);
}

function buyLine(){
if(gum<lineCost)return;
gum-=lineCost;
lineLv++;
lineCost=Math.floor(lineCost*1.3);
}

function prestige(){

if(totalGum<100000)return;

let gain=Math.floor(
Math.sqrt(totalGum/100000)
);

if(gain<=0)return;

pp+=gain;

gum=0;

autoLv=0;
powerLv=0;
lineLv=0;

autoCost=10;
powerCost=25;
lineCost=100;
}

function update(){

document.getElementById("gum").textContent=
format(gum)+" グミ";

document.getElementById("autoLv").textContent=
autoLv;

document.getElementById("powerLv").textContent=
powerLv;

document.getElementById("lineLv").textContent=
lineLv;

document.getElementById("autoCost").textContent=
format(autoCost);

document.getElementById("powerCost").textContent=
format(powerCost);

document.getElementById("lineCost").textContent=
format(lineCost);

document.getElementById("pp").textContent=
pp;
}

setInterval(()=>{

let gain=gainPerSecond()/10;

gum+=gain;
totalGum+=gain;

update();

},100);

function save(){

localStorage.setItem(
"gumFactory",
JSON.stringify({
gum,
totalGum,
autoLv,
powerLv,
lineLv,
pp,
autoCost,
powerCost,
lineCost,
lastTime:Date.now()
})
);

}

setInterval(save,5000);

function load(){

let s=
localStorage.getItem("gumFactory");

if(!s)return;

let d=JSON.parse(s);

Object.assign(window,d);

let offline=
(Date.now()-d.lastTime)/1000;

let gain=
gainPerSecond()*offline;

gum+=gain;
totalGum+=gain;

}

load();
update();
</script>

</body>
</html>
